[package]
name = "libafl_nautilus"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
libafl = { git = "https://github.com/AFLplusplus/LibAFL", rev = "12c2bb4", features = [
  "std",
  "nautilus",
] }
libafl_bolts = { git = "https://github.com/AFLplusplus/LibAFL", rev = "12c2bb4", features = [
  "std",
] }
custom_mutator = { path = "../rust/custom_mutator", features = [
  "afl_internals",
] }
libafl_base = { path = "../libafl_base", default-features = false, features = [
  "mutator",
] }
serde = { version = "1.0", default-features = false, features = ["alloc"] }
postcard = { version = "1.0", features = ["alloc"] }
clap = { version = "4.5", features = ["derive"] }
lru = "0.12"
[features]
default = []

[lib]
crate-type = ["cdylib"]
