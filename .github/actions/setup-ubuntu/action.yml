name: 'Setup Ubuntu Environment'
description: 'Updates apt and installs common build dependencies for AFL++'
runs:
  using: "composite"
  steps:
    - name: update
      shell: bash
      run: sudo apt-get update && sudo apt-get upgrade -y
    - name: install common packages
      shell: bash
      run: |
        sudo apt-get install -y -m -f \
          build-essential \
          git \
          libtool \
          libtool-bin \
          automake \
          flex \
          bison \
          libglib2.0-0 \
          libglib2.0-dev \
          libc++-dev \
          findutils \
          libcmocka-dev \
          python3-dev \
          python3-setuptools \
          meson \
          python3-pip \
          gcc-12-plugin-dev
