name: Container
on:
  push:
    branches:
      - stable
      - dev
    tags:
      - "*"
  pull_request:
    branches:
      - stable # No need for stable-pull-request, as that equals dev-push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: docker.io/aflplusplus/aflplusplus

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner-type: ubuntu-24.04
            arch: amd64
          - runner-type: ubuntu-24.04-arm
            arch: arm64
    name: Test ${{ matrix.arch }} image
    runs-on: ${{ matrix.runner-type }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.arch }}
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: aflplusplus:test
          load: true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }},ignore-error=true
          build-args: |
            TEST_BUILD=1
      - name: Test
        run: >
          docker run --rm aflplusplus:test bash -c "
          apt-get update &&
          apt-get install -y libcmocka-dev &&
          make -i tests
          "

  push:
    name: Push ${{ matrix.arch }} image
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner-type: ubuntu-24.04
            arch: amd64
          - runner-type: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner-type }}
    timeout-minutes: 90
    needs:
      - build-and-test
    if: ${{ github.event_name == 'push' && github.repository == 'AFLplusplus/AFLplusplus' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to docker.io
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and push ${{ matrix.arch }} by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Push multi-arch manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - push
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to docker.io
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Create and push manifest list
        working-directory: /tmp/digests
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAGS="-t ${IMAGE_NAME}:${REF_NAME}"
          if [ "${REF_NAME}" = "stable" ]; then
            TAGS="${TAGS} -t ${IMAGE_NAME}:latest"
          fi
          REFS=
          for digest in *; do
            REFS="${REFS} ${IMAGE_NAME}@sha256:${digest}"
          done
          docker buildx imagetools create ${TAGS} ${REFS}
      - name: Inspect image
        env:
          REF_NAME: ${{ github.ref_name }}
        run: docker buildx imagetools inspect "${IMAGE_NAME}:${REF_NAME}"
